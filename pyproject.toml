[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccf-agent"
version = "0.1.0"
description = "Configurable prompt, LaTeX, and harness template for CCF-style and conference paper writing agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ccf-agent contributors" }
]
keywords = ["agent", "latex", "paper-writing", "prompt", "harness", "ccf"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Markup :: LaTeX"
]
dependencies = []

[project.scripts]
ccf-agent = "ccf_agent.cli:main"

[tool.setuptools]
packages = ["ccf_agent"]
